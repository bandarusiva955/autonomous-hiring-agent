<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Hiring Agent{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
    <nav class="nav">
        <a class="brand" href="{{ url_for('index') }}">AI Hiring Agent</a>
        <a class="link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">Single resume</a>
        <a class="link {% if request.path.startswith('/bulk') %}active{% endif %}" href="{{ url_for('hr.bulk_form') }}">HR bulk screening</a>
        <a class="link {% if request.path.startswith('/roadmaps') %}active{% endif %}" href="{{ url_for('roadmaps.index') }}">Roadmaps</a>
    </nav>
    <main class="page">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
